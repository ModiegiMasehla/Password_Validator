[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "password-validator"
version = "1.0.0"
description = "A small, tested password strength validator with clear error messages"
readme = "README.md"
requires-python = ">=3.8"

[tool.setuptools]
packages = ["password_validator"]
